name: Generate ER Diagram

on:
  push:
    paths:
      - 'schema.dbml'
    branches:
      - main
  workflow_dispatch: 

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ActionがリポジトリにSVGをプッシュするための権限
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SVG from DBML
        # npxを使って一時的にレンダラーをダウンロードし、変換を実行
        run: npx @softwaretechnik/dbml-renderer -i schema.dbml -o schema.svg

      - name: Create Pull Request
        # 直接プッシュせず、別ブランチを作成してPRを生成する
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: ER図(SVG)を自動更新"
          branch: "docs/update-er-diagram"
          title: "docs: ER図(SVG)の自動更新"
          body: "schema.dbml の変更に伴い、自動生成された schema.svg を更新します。"
